<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <title>Reset Password - AgriMate</title>
    <link rel="icon" type="image/x-icon" href="/static/wheat.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: url(./static/bg.jpg) no-repeat;
            background-position: center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 400px;
            height: 500px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            border-radius: 20px;
            border: 3px solid rgba(255, 255, 255, 0.5);
        }

        h2 {
            color: #ffff;
            font-size: 2em;
            text-transform: uppercase;
            padding: 20px 0;
        }

        .form-group {
            position: relative;
            width: 330px;
            margin: 20px 0;
            border-bottom: 3px solid #ffff;
        }

        .form-group input {
            width: 100%;
            height: 50px;
            padding: 0 35px 0 10px;
            font-size: 1.2em;
            background-color: transparent;
            border: none;
            outline: none;
            color: #fff;
        }

        .form-group label {
            font-size: 1.2em;
            color: #fff;
            transition: 0.5s;
            text-align: left;
        }

        input:focus~label,
        input:valid~label {
            top: -5px;
        }

        .form-group i {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            color: #ffff;
            font-size: 1.2em;
            cursor: pointer;
        }

        p {
            text-align: center;
            color: #fff;
            margin: 10px 0;
        }

        p>a {
            text-decoration: none;
            color: #fff;
            font-weight: 600;
        }

        p>a:hover {
            text-decoration: underline;
            font-style: italic;
        }

        #reset {
            width: 100%;
            height: 50px;
            border-radius: 40px;
            border: none;
            font-size: 1.5em;
            text-transform: uppercase;
            font-weight: 600;
            margin: 10px 0;
            cursor: pointer;
            transition: all 0.5s;
        }

        #reset:hover {
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
        }

        .left-align {
            text-align: left;
            width: 100%;
            padding-left: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <form name="reset_password_form" id="resetPasswordForm" method="post" action="#" enctype="multipart/form-data">
            <div class="col-sm-4 col-sm-offset-4">
                <h2>Reset Password</h2>
                <div class="form-group">
                    <label for="new_password">New Password</label>
                    <input type="password" name="new_password" id="new_password" class="form-control" placeholder="Enter new password">
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="Confirm new password">
                </div>
                <button type="button" id="reset" name="reset" class="btn btn-success">Reset Password</button>
                <p class="left-align"><a href="/login">Remembered your password? Click here</a></p>
            </div>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { getAuth, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAq_Z-B8BrOm6fTNPRSVXX7_QHQSJIDnmw",
            authDomain: "login-with-firebase-data-5cef4.firebaseapp.com",
            databaseURL: "https://login-with-firebase-data-5cef4-default-rtdb.firebaseio.com",
            projectId: "login-with-firebase-data-5cef4",
            storageBucket: "login-with-firebase-data-5cef4.appspot.com",
            messagingSenderId: "932267970494",
            appId: "1:932267970494:web:d02b5a00f4b0e547f8b3ef"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth();
        console.log(app);

        document.getElementById("reset").addEventListener("click", function () {
            const urlParams = new URLSearchParams(window.location.search);
            const oobCode = urlParams.get('oobCode');
            const newPassword = document.getElementById("new_password").value;
            const confirmPassword = document.getElementById("confirm_password").value;

            if (newPassword === confirmPassword) {
                if (oobCode && newPassword) {
                    confirmPasswordReset(auth, oobCode, newPassword)
                        .then(() => {
                            alert("Password has been reset successfully.");
                            window.location.href = "/login";
                        })
                        .catch((error) => {
                            const errorCode = error.code;
                            const errorMessage = error.message;
                            console.log(errorMessage);
                            alert(errorMessage);
                        });
                } else {
                    alert("Invalid request.");
                }
            } else {
                alert("Passwords do not match.");
            }
        });
    </script>
</body>

</html>
